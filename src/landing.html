<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>document.documentElement.classList.add('js')</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="robots" content="{{robots}}">
<link rel="canonical" href="{{canonical}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{site_name}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{og_image}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#F3F0E8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15171C" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,300..800;1,62..125,300..800&display=swap">
<link rel="stylesheet" href="/css/site.css">
{{jsonld}}
{{pixel}}
</head>
<body data-page="{{page}}" class="landing">

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="ai-mark" viewBox="0 0 240 240">
      <polygon class="half" style="fill: currentColor" points="20,220 100,20 103,20 103,220"/>
      <polygon class="half" style="fill: currentColor" points="137,220 137,20 140,20 220,220"/>
      <rect class="bar" style="fill: var(--accent)" x="109" y="2" width="22" height="218"/>
    </symbol>
  </defs>
</svg>

<a class="skip" href="#main">Skip to content</a>

<!-- Landing pages have no menu: the logo is the only way out, and it goes to the homepage. -->
<header class="top landing-top">
  <div class="wrap">
    <a class="brand" href="/" aria-label="Albright Innovations home">
      <svg class="mark" aria-hidden="true"><use href="#ai-mark"/></svg>
      <span class="wordmark"><b>A</b>lbright <b>I</b>nnovations</span>
    </a>
  </div>
</header>

<main id="main">
{{body}}
</main>

<footer class="landing-foot">
  <div class="wrap">
    <div class="foot-grid">
      <div class="foot-brand">
        <a class="brand" href="/" aria-label="Albright Innovations home">
          <svg class="mark" aria-hidden="true"><use href="#ai-mark"/></svg>
          <span class="wordmark"><b>A</b>lbright <b>I</b>nnovations</span>
        </a>
        <span class="tag">Authentic Influence</span>
        <p class="foot-areas">Big Rapids and West Michigan. Charlotte, Waxhaw and Union County, North Carolina.</p>
      </div>
      <div class="foot-reach">
        <a class="email" href="mailto:{{email}}">{{email}}</a>
        <a class="social" href="/"><span>Visit the main site</span></a>
      </div>
    </div>
    <div class="foot-end">
      <small>&copy; {{year}} Albright Innovations &middot; <a href="/privacy/">Privacy</a> &middot; <a href="/terms/">Terms</a></small>
    </div>
  </div>
</footer>

{{sticky}}

<script src="/js/lead.js" defer></script>
{{scripts}}
</body>
</html>
